log_level: DEBUG

# gitlab_api under arc_store is deprecated; prefer git_repo.
# arc_store:
#   gitlab_api:
#     group: FAIRagro-advanced-middleware-dev
#     url: https://datahub-dev.ipk-gatersleben.de
#     max_workers: 10
#     commit_chunk_size: 200
arc_store:
  git_repo:
    url: https://datahub-dev.ipk-gatersleben.de
    group: FAIRagro-advanced-middleware-dev
    max_workers: 10
    rdi_gitlab_topics:
      bonares: bonares
      edal: "e!DAL"
      edaphobase: edaphobase
      openagrar: openagrar
      publisso: publisso
      thunen_atlas: thunen_atlas
# Optional consolidated catalog:
# consolidated_store:
#   consolidated_git:
#     repo_url: https://datahub-dev.ipk-gatersleben.de/group/catalog.git
known_rdis:
- bonares
- edal
- edaphobase
- openagrar
- publisso
- thunen_atlas
require_client_cert: false

# Enable CouchDB and allow environment overrides (like COUCHDB_URL)
couchdb: {}

celery: {}

health_checks:
  readiness_check_couchdb: true
  readiness_check_rabbitmq: true
  global_health_check_workers: true
  global_health_check_git_backend: false

# Per-client rate limits on harvest/ARC write POSTs (process-local; default off).
# rate_limiting:
#   enabled: true
#   harvest_create_per_minute: 10   # POST /v3/harvests
#   arc_submit_per_minute: 60       # POST /v2|/v3/arcs and /v3/harvests/{id}/arcs
#   retry_after_seconds: 60         # jittered Retry-After upper bound on 429

otel:
  # endpoint: http://signoz:4318  # Uncomment to enable Signoz tracing
  # log_console_spans: true       # Enable SPAN logging to console
  # log_level: INFO
