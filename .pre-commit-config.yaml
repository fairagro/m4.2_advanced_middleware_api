# Pre-commit configuration (shared Devinfra skeleton for product sync).
# See https://pre-commit.com
#
# Commit stage: fast checks / autofixes.
# Pre-push: pytest (excludes system_external/system_local) + container-structure-test
# (git hook install is issue #9).
#
# Python hooks target middleware/ (path conventions). This Devinfra repo has no
# product middleware/ packages — those hooks no-op until synced to a product.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: end-of-file-fixer
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-yaml
        # Vendor skills + Go-templated Helm (API helmchart/*, Harvester helm/*). Harmless if absent (#63).
        exclude: ^(\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/|(helm|helmchart)(/[^/]+)*/templates/.*\.ya?ml$)
      - id: check-added-large-files
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-merge-conflict
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-toml
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: debug-statements
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/

  - repo: local
    hooks:
      - id: ggshield
        name: ggshield secret scan
        # Fleet CLI via scripts/run-quality-cli.sh (no product pyproject dep required)
        entry: bash scripts/run-quality-cli.sh ggshield secret scan pre-commit
        language: system
        pass_filenames: false

      - id: ruff
        name: ruff lint
        entry: bash scripts/run-quality-cli.sh ruff check --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: ruff-fix
        name: ruff lint (autofix)
        entry: bash scripts/run-quality-cli.sh ruff check --fix --exit-non-zero-on-fix --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash scripts/run-quality-cli.sh ruff format --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: bash scripts/run-quality-cli.sh mypy middleware/
        language: system
        files: ^middleware/
        pass_filenames: false
        args: [--config-file, mypy.ini]

      - id: bandit
        name: bandit security scan
        # -ll: MEDIUM+ only (`.bandit` has no fail-on-severity; same fail bar as CI — see docs/quality.md)
        entry: bash scripts/run-quality-cli.sh bandit -r middleware/ -c .bandit -ll
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: pylint
        name: pylint
        # No --source-roots here: product paths stay on CI pylint_source_roots / process env
        # (docs/quality.md). fail-under in .pylintrc is the gate, not E0401 alone.
        entry: bash scripts/run-quality-cli.sh pylint --rcfile .pylintrc middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: vulture
        name: vulture unused code
        # Confidence 100; no synced whitelist — FP → fix or # noqa in product code (docs/quality.md)
        entry: bash scripts/run-quality-cli.sh vulture middleware/ --min-confidence 100
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: import-linter
        name: import-linter contracts
        # Product-owned `.importlinter` (fleet settings in docs/quality.md)
        entry: bash scripts/run-import-linter.sh
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: uv-audit
        name: uv audit (lockfile CVEs)
        # Frozen lockfile; optional product `.uv-audit-ignore` overlay — needs OSV network (docs/quality.md)
        entry: ./scripts/run-uv-audit.sh
        language: system
        files: ^(uv\.lock|pyproject\.toml|\.uv-audit-ignore)$
        pass_filenames: false

      - id: markdownlint
        name: markdownlint-cli2
        entry: npm run lint:md
        language: system
        files: \.(md|mdc)$
        pass_filenames: false
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/

      - id: pytest
        name: pytest
        entry: >-
          bash -c 'echo "pre-push pytest excludes system_external/system_local
          (may take several minutes). Escape hatch only: SKIP=pytest git push" >&2;
          uv run pytest -m "not system_external and not system_local"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: container-structure-test
        name: container structure test
        entry: bash scripts/run-container-structure-test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
