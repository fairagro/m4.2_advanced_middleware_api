# Self-hosted Renovate (shared SoT — sync to product repos via #13).
# Requires repository Actions secret DEVINFRA_BOT_TOKEN (fine-grained PAT; shared with product sync).
# See docs/renovate.md / docs/sync.md.
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - renovate.json

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          # Do NOT pass configurationFile: renovate.json. The Action mounts that path as
          # RENOVATE_CONFIG_FILE (global/bot config). Renovate then also loads the cloned
          # repo's renovate.json; customManagers is mergeable, so every regex manager runs
          # twice → "Cannot find replaceString" / update failure (Dependency Dashboard #80).
          # Repo config alone is enough; see docs/renovate.md.
          token: ${{ secrets.DEVINFRA_BOT_TOKEN }}
        env:
          # Scope the bot token to this step only (not checkout).
          GITHUB_COM_TOKEN: ${{ secrets.DEVINFRA_BOT_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
