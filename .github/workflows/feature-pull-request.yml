name: Feature Pull Request

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'main'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'middleware/**'
              - 'pyproject.toml'
              - 'docker/**'
              - 'scripts/**'
              - '.github/workflows/**'

  code-quality:
    name: Code Quality
    needs: detect-changes
    # SHA pin until fairagro/m4.2_middleware_devinfra#72 lands on main (mypy_path / pylint_source_roots).
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@a061d6fb85afc8dfd54083ff58bf788744dcdca8
    with:
      python_package_root: middleware
      components: '["api"]'
      mypy_path: stubs:middleware/api/src:middleware/api_client/src:middleware/shared/src:middleware/api/tests/unit:middleware/api_client/tests/unit:middleware/shared/tests
      pylint_source_roots: middleware/api/src,middleware/api/tests/unit,middleware/api_client/tests/unit,middleware/shared/tests
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit

  build:
    name: Build
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@main
    with:
      components: '["api"]'
      image_base_name: fairagro-advanced-middleware
    secrets: inherit

  check:
    name: Check
    needs: [detect-changes, build]
    if: always() && needs.detect-changes.result == 'success'
    # Local until Devinfra #74: omit Trivy licence-check (Alpine GPL noise).
    uses: ./.github/workflows/reusable-check-local.yml
    with:
      version: ${{ needs.build.outputs.version || '' }}
      components: '["api"]'
      image_base_name: fairagro-advanced-middleware
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit
