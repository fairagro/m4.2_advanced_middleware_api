name: Helm Chart Release

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: >-
          Chart version bump: auto = Conventional Commits via git-cliff;
          or explicit major / minor / patch
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  helm:
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-helm-release.yml@main
    with:
      version_bump: ${{ inputs.version_bump }}
      chart_dir: charts/fairagro-advanced-middleware-api-chart
      chart_name: fairagro-advanced-middleware-api-chart
      dockerhub_namespace: zalf
      require_main: true
      helm_install_name: fairagro-middleware
    secrets: inherit
