# Local chart smoke-test overlay (see docs/helmchart_related.md).
# Supplies an ArcStore backend — chart defaults intentionally omit one.
config:
  git_repo:
    url: https://datahub-dev.ipk-gatersleben.de
    group: FAIRagro-advanced-middleware-dev
    max_workers: 10
    rdi_gitlab_topics:
      bonares: bonares
      edal: "e!DAL"
      edaphobase: edaphobase
      openagrar: "OpenAgrar Repository"
      publisso: Publisso
      thunen_atlas: "Thunen Atlas"

api:
  tls:
    serverCrtFile: server.crt
    serverKeyFile: server.key
    caCrtFile: ca.crt

  image:
    repository: fairagro-advanced-middleware-api
    tag: test
    imagePullPolicy: Never

  ingress:
    enabled: true
    mtlsEnabled: true
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: server-tls
        hosts:
          - chart-example.local

celery:
  image:
    repository: fairagro-advanced-middleware-api
    tag: test
    imagePullPolicy: Never
  worker:
    concurrency: 1
