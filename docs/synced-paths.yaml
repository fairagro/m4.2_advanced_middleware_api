# Sole source of truth for paths synced from Devinfra into consumer repos.
# Consumers must not hand-edit allowlisted files after sync (corrections → Devinfra → sync).
# No product-local synced-paths overlay. Human inventory + overlay patterns: docs/sync.md
# Policy / review-fixer: docs/ai_review_policy.md#synced-paths-sync-source-of-truth
# Synced Markdown must not use in-repo relative links to paths outside allow (minus exclude);
# use absolute Devinfra URLs (blob/main) or plain non-linked names — see docs/sync.md.
#
# Profiles (#350 / #351 / #352 / #354): effective allow = union of the target's profiles.
# foundation = skills/AI plumbing + shared hook helpers + Renovate + versions.env
#   (not Infra-only pre-commit root; never `.devcontainer/**` or `.python-version`)
# python-product = Python quality / product Dev Container blob / product pre-commit root
# gitops = Helm lint runner (shared by product + Infra configs)
# infra-consumer = Infra-only paths (e.g. `.pre-commit-config.infrastructure.yaml`)
# #352: Infra keeps fat GitOps Dev Container until adoption — do not add `.devcontainer/**`
#   to foundation/gitops/infra-consumer. Pin ownership: docs/sync.md + docs/devcontainer.md.
# #354: Infra gets Renovate + versions.env via foundation (unused pins are no-ops until a
#   Dockerfile/hook reads them). Live sync still defaults skip_infrastructure until bot checklist.

profiles:
  foundation:
    allow:
      - docs/ai_review_policy.md
      - docs/synced-paths.yaml
      - docs/sync.md
      - docs/review-fixer.md
      - docs/create-issue.md
      - docs/code-review.md
      - docs/issue-fixer.md
      - .cursor/BUGBOT.md
      - .github/copilot-instructions.md
      - .cursor/commands/review-fixer.md
      - .cursor/commands/create-issue.md
      - .cursor/commands/code-review.md
      - .cursor/commands/issue-fixer.md
      - .github/prompts/review-fixer.prompt.md
      - .github/prompts/create-issue.prompt.md
      - .github/prompts/code-review.prompt.md
      - .github/prompts/issue-fixer.prompt.md
      - .agents/skills/review-fixer/**
      - .agents/skills/create-issue/**
      - .agents/skills/code-review/**
      - .agents/skills/issue-fixer/**
      - .agents/skills/arctrl/**
      - .agents/skills/gh/**
      - .agents/skills/docker/**
      - .agents/skills/hadolint/**
      - .agents/skills/uv/**
      - scripts/ai/**
      - scripts/dev-tokens.sh
      - scripts/set-dev-tokens.sh
      - scripts/bin/gh
      - scripts/bin/git
      - scripts/bin/m42-ai
      - scripts/commit-path-check.sh
      - scripts/install-gitleaks.sh
      - scripts/install-actionlint.sh
      - scripts/install-kubeconform.sh
      - scripts/run-kubeconform.sh
      - .gitleaksignore
      - package.json
      - package-lock.json
      - .markdownlint.json
      - .markdownlint-cli2.jsonc
      - .markdownlintignore
      - .prettierrc.json
      - .prettierignore
      - commitlint.config.cjs
      - docs/renovate.md
      - renovate.json
      - .github/workflows/renovate.yml
      - versions.env

  python-product:
    allow:
      - docs/surface-quality-bar.global.md
      - docs/quality.md
      - docs/devcontainer.md
      - docs/conventions.md
      - docs/ci.md
      - scripts/bin/k
      - scripts/bin/d
      - scripts/quality-check.sh
      - scripts/quality-fix.sh
      - scripts/run-container-structure-test.sh
      - scripts/run-import-linter.sh
      - scripts/run-quality-cli.sh
      - scripts/load-quality-path-env.sh
      - scripts/quality-tools-pins.txt
      - scripts/run-uv-audit.sh
      - scripts/detect-version-bump.sh
      - scripts/generate-release-changelog.sh
      - scripts/install-git-cliff.sh
      - scripts/install-cst.sh
      - scripts/setup-git-hooks.sh
      - scripts/update-dockerfile-pins.sh
      - scripts/prune-merged-branches.sh
      - scripts/git-hooks/**
      - scripts/load-versions-env.sh
      - scripts/devcontainer-post-create.sh
      - scripts/import-public-gpg-keys.sh
      - openspec/principles.global.md
      - .github/workflows/codeql.yml
      - docker/Dockerfile.product-app.base
      - .python-version
      - .pre-commit-config.yaml
      - .bandit
      - ruff.toml
      - mypy.ini
      - .pylintrc
      - pyrightconfig.json
      - cliff.toml
      - .vscode/settings.json
      - .vscode/extensions.json
      - .cursorrules
      - .devcontainer/Dockerfile
      - .devcontainer/devcontainer.json
      - .devcontainer/docker-compose.yml
      - .devcontainer/starship.toml
      - .gitignore

  gitops:
    allow:
      - scripts/run-helm-lint.sh

  infra-consumer:
    allow:
      - .pre-commit-config.infrastructure.yaml

targets:
  api:
    repo: fairagro/m4.2_advanced_middleware_api
    profiles: [foundation, python-product, gitops]
  sql_to_arc:
    repo: fairagro/m4.2_sql_to_arc
    profiles: [foundation, python-product, gitops]
  harvester:
    repo: fairagro/m4.2_middleware_harvester
    profiles: [foundation, python-product, gitops]
  infrastructure:
    repo: fairagro/m4.2_infrastructure
    profiles: [foundation, gitops, infra-consumer]

# Never copy — even if mis-listed under allow.
exclude:
  - middleware/**
  - openspec/specs/**
  - openspec/changes/**
  - .github/workflows/reusable-*.yml
  - docs/surface-quality-bar.md
  - openspec/principles.md
  - AGENTS.md
  - .devcontainer/product.env
  - .uv-audit-ignore
  - .importlinter

# Product-local overlays (MAY edit in consumers; never overwritten by sync).
overlays:
  - docs/surface-quality-bar.md
  - openspec/principles.md
  - AGENTS.md
  - .devcontainer/product.env
  - .uv-audit-ignore
  - .importlinter
