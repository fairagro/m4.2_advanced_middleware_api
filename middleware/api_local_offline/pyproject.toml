[project]
name = "fairagro-middleware-api-local-offline"
dynamic = ["version"]
description = "Local offline Middleware API stand-in (harvest HTTP + ARC on disk for consumer tests)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fairagro-middleware-shared",
    "arctrl>=3.2.2",
    "fastapi>=0.124.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
middleware-api-local-offline = "middleware.api_local_offline.main:main"

[tool.uv.sources]
fairagro-middleware-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", fallback_version = "0.0.0", tag_regex = "^(?:v|.*-(?:chart|docker)-v)(?P<version>\\d+\\.\\d+\\.\\d+)(?:$|[-+].*)" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
