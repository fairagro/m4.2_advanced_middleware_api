[project]
name = "fairagro-middleware-api-v3"
dynamic = ["version"]
description = "Shared FastAPI /v3 harvest and ARC lifecycle HTTP surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fairagro-middleware-shared",
    "fastapi>=0.124.0",
]

[tool.uv.sources]
fairagro-middleware-shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", fallback_version = "0.0.0", tag_regex = "^(?:v|.*-(?:chart|docker)-v)(?P<version>\\d+\\.\\d+\\.\\d+)(?:$|[-+].*)" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
