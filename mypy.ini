# Shared Mypy config for m4.2 product repos (sync into product checkout root).
# Seeded from m4.2_advanced_middleware_api strictness settings.
#
# Product path overlay: do not edit this synced file (sync overwrites it). Shared hooks/CI
# pass --config-file mypy.ini, so [tool.mypy] in product pyproject.toml is ignored.
# Set MYPYPATH (or equivalent product hook/CI env) for import roots, e.g. API-shaped:
#   MYPYPATH=middleware/api/src:middleware/api_client/src:middleware/shared/src
# Do not fork the shared strictness flags into a second config.
# No python_version pin — mypy follows the uv-selected interpreter (versions.env / .python-version).

[mypy]
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
explicit_package_bases = True
namespace_packages = True
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^\.git/
    | ^__pycache__/
    | ^build/
    | ^dist/
    | ^\.pytest_cache/
    | ^\.mypy_cache/
    | ^\.ruff_cache/
    | .*/tests/conftest\.py$
    | .*/tests/.+/conftest\.py$
  )
