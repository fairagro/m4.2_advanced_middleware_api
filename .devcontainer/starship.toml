# Fleet Dev Container Starship config (STARSHIP_CONFIG via remoteEnv).
# Repo identity comes from DEVCONTAINER_REPO_NAME (${localWorkspaceFolderBasename}).
# cwd is /workspace, so the directory module alone cannot show the host folder name.

"$schema" = "https://starship.rs/config-schema.json"

format = """\
$env_var\
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$line_break\
$character\
"""

[env_var.DEVCONTAINER_REPO_NAME]
variable = "DEVCONTAINER_REPO_NAME"
format = "[$env_value]($style) "
style = "bold cyan"
disabled = false

# At repo root the path basename is "workspace"; hide that redundant segment.
# Under subdirs Starship still shows the path relative to the git root.
[directory]
truncation_length = 3
truncate_to_repo = true
style = "cyan bold"
substitutions = { "workspace" = "" }

[python]
# VIRTUAL_ENV=/workspace/.venv is set by remoteEnv (activated without `source`).
# Parent of `.venv` is `workspace`, so native $virtualenv is useless — omit it.
format = 'via [${symbol}${version} ]($style)'

# Markdown tooling ships package.json; npm version in the prompt is noise for Python repos.
[package]
disabled = true

[nodejs]
disabled = true

# Always in a Dev Container — no need for ⬢ [Docker].
[container]
disabled = true

[docker_context]
disabled = true
