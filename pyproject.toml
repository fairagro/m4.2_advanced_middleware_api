[project]
name = "m4-2-advanced-middleware"
version = "6.0.0"
description = "The FAIRagro advanced middleware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "api",
  "fairagro-middleware-api-client",
  "fairagro-middleware-shared",
]

[dependency-groups]
dev = [
  "fastapi[standard]>=0.136.0",
  "httpx>=0.28.1",
  "pylint>=4.0.4",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=7.0.0",
  "pytest-env>=1.2.0",
  "pytest-mock>=3.10.0",
  "mypy>=1.20.1",
  "bandit>=1.7.0",
  "ruff>=0.15.10",
  "pre-commit>=4.0.0",
  "ggshield>=1.51.0",
  "respx>=0.23.1",
  "testcontainers>=4.14.2",
  # Starlette TestClient (FastAPI API tests) uses httpx2 when installed; avoids
  # StarletteDeprecationWarning. Production api_client still uses httpx + respx.
  "httpx2>=2.4.0",
]

[tool.uv.sources]
api = { workspace = true }
fairagro-middleware-api-client = { workspace = true }
fairagro-middleware-shared = { workspace = true }

[tool.uv.workspace]
members = [
    "middleware/api",
    "middleware/api_client",
    "middleware/shared",
    "middleware/tools",
]

# ggshield 1.51 pins outdated transitive deps; overrides align with workspace
# requirements and resolve Dependabot advisories without dropping ggshield.
[tool.uv]
override-dependencies = [
    "cryptography>=45.0.6",
    "pyjwt>=2.12.0",
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
]

# Quality tool config lives in synced fragments (ruff.toml, mypy.ini, .pylintrc).
# See docs/quality.md — do not reintroduce [tool.ruff] / [tool.mypy] / [tool.pylint.*] here.

[tool.pyright]
# IDE import resolution (Pylance / BasedPyright); mirrors MYPYPATH / pylint source-roots.
extraPaths = [
  "middleware/api/src",
  "middleware/api_client/src",
  "middleware/shared/src",
  "middleware/api/tests/unit",
  "middleware/api_client/tests",
  "middleware/shared/tests",
]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["middleware/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Suppress DeprecationWarnings from intentionally deprecated modules so tests
# stay clean. Use pytest.warns(DeprecationWarning) to assert the warnings
# explicitly where needed.
filterwarnings = [
    "ignore:GitlabApi.*is deprecated:DeprecationWarning",
    "ignore:GitlabApiConfig.*is deprecated:DeprecationWarning",
    # Pydantic Field(deprecated=...) on legacy top-level ArcStore keys.
    # Assert with pytest.warns where needed.
    "ignore:Top-level git_repo is obsolete:DeprecationWarning",
    "ignore:Top-level gitlab_api is obsolete:DeprecationWarning",
    "ignore:Top-level consolidated_git is obsolete:DeprecationWarning",
    # Pydantic emits a bare 'deprecated' warning whenever a deprecated field
    # is *accessed* on a model instance.  In tests we intentionally exercise
    # paths that touch the deprecated gitlab_api field; suppress the noise.
    "ignore:deprecated:DeprecationWarning:middleware\\.api\\.config",
]

# Output and behavior
addopts = [
    "-v",                        # Verbose output
    "-ra",                       # Show summary for skipped/xfail/etc. with reasons
    "--strict-markers",          # Treat unregistered markers as errors
    "--tb=short",                # Shorter traceback format
    "--cov=middleware",          # Enable coverage for middleware packages
    "--cov-report=term-missing", # Show missing lines in terminal
    "--cov-report=html",         # Generate HTML coverage report
    "--cov-report=xml",          # Generate XML coverage report (for CI)
    "--cov-fail-under=80",       # Fail if coverage is below 80%
]

# Asyncio mode
asyncio_mode = "auto"

# Custom markers
markers = [
    "asyncio: marks tests as async",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "system_local: marks tests that use locally runnable external services (e.g. testcontainers)",
    "system_external: marks tests that depend on real external systems/secrets",
]

[tool.coverage.run]
# Coverage measurement settings
source = ["middleware"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/.pytest_cache/*",
    "*/build/*",
    "*/dist/*",
    "*/*.egg-info/*",
]
branch = true  # Measure branch coverage

[tool.coverage.report]
# Coverage reporting settings
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
