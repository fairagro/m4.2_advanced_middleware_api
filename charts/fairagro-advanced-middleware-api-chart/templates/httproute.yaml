{{- if .Values.api.httpRoute.enabled -}}
{{- $clientTls := .Values.api.httpRoute.clientTls | default dict -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fairagro-advanced-middleware-api-chart.fullname" . }}
  labels:
    {{- include "fairagro-advanced-middleware-api-chart.labels" . | nindent 4 }}
spec:
  {{- with .Values.api.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.api.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if $clientTls.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: {{ include "fairagro-advanced-middleware-api-chart.clientTlsSnippetsFilterName" . }}
      {{- end }}
      backendRefs:
        - name: {{ include "fairagro-advanced-middleware-api-chart.fullname" . }}
          port: {{ .Values.api.service.port }}
{{- end }}
